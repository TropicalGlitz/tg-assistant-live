# Render Blueprint — despliegue del backend con un clic.
# La base de datos es externa (Supabase con pgvector); solo desplegamos el web service.
# En Render: New → Blueprint → conecta el repo → completa las env vars marcadas sync:false.
services:
  - type: web
    name: tg-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: SHOPIFY_SHOP_DOMAIN
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2025-07"
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-opus-4-8
